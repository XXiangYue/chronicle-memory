[project]
name = "chronicle-memory"
version = "0.1.0"
requires-python = ">=3.12"
description = "Source-aware, time-aware long-term memory with compact evidence and retrieval fallback."
dependencies = ["httpx>=0.28", "numpy>=2.0", "fastembed>=0.7", "tiktoken>=0.9"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.26", "ruff>=0.11"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
chronicle = "chronicle.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
